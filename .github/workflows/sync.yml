name: Sincronizar playlists

on:
  workflow_dispatch:
  schedule:
    # COLETA DIÁRIA: altere os cinco campos abaixo para mudar o horário.
    # Formato: minuto hora dia-do-mês mês dia-da-semana, sempre em UTC.
    # Exemplo atual: todos os dias às 03:17 UTC (00:17 no horário de Brasília).
    # Para executar a cada 6 horas, use: "17 */6 * * *"
    # Para executar a cada 12 horas, use: "17 */12 * * *"
    - cron: "17 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Coletar catálogo e gerar playlists
        run: python sync.py

      - name: Validar arquivos
        run: |
          set -e
          test -s public/canais-tv.m3u8
          test -s public/desenhos.m3u8
          test -s public/filmes.m3u8
          test -s public/series.m3u8
          test -s public/players-fallback.m3u8
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('public/status.json').read_text())
          if status['channels_collected'] < 1:
              raise SystemExit('catálogo vazio')
          for path in Path('public').glob('*.m3u8'):
              text = path.read_text()
              if not text.startswith('#EXTM3U'):
                  raise SystemExit(f'cabeçalho inválido: {path}')
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: Salvar playlists no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas playlists."
          else
            git commit -m "Atualizar playlists automaticamente"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
